    <div id="cg1" class="clip grp" data-start="0.979" data-duration="0.617" data-track-index="1" style="top:1400px"><div class="in">dann räumt <span style="color:#FF4D5E">Herr Geier</span></div></div>

    <div id="cg5" class="clip grp" data-start="4.15" data-duration="1.4" data-track-index="1" style="top:1400px"><div class="in">Aber heute kriegt er <span style="color:#4BE08A">Hilfe</span> –</div></div>
    <div id="cg6" class="clip grp" data-start="5.55" data-duration="1.604" data-track-index="1" style="top:1400px"><div class="in">von <span style="color:#FFE14A">Maxim</span> aus den Kommentaren!</div></div>

    <div id="cg16" class="clip grp" data-start="18.658" data-duration="0.696" data-track-index="1" style="top:1400px"><div class="in">ist sie weg.</div></div>
    <div id="cg17" class="clip grp" data-start="19.354" data-duration="1.319" data-track-index="1" style="top:1400px"><div class="in"><span style="color:#4BE08A">250 Euro!</span></div></div>

    <div id="cg20" class="clip grp" data-start="22.783" data-duration="1.482" data-track-index="1" style="top:1400px"><div class="in">für <span style="color:#FF4D5E">180 Euro.</span></div></div>
